<div class="card border-0 shadow-lg mb-4" style="border-radius: 25px;">
    <div class="card-header bg-white border-0 py-4 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold text-navy">Propuestas Estudiantiles</h5>
        <button class="btn btn-primary btn-sm rounded-circle shadow" data-bs-toggle="collapse" data-bs-target="#boxPropuesta"><i class="fas fa-plus"></i></button>
    </div>
    <div class="card-body">
        <div class="collapse mb-4" id="boxPropuesta">
            <form action="{{ url_for('nueva_propuesta') }}" method="POST" class="bg-light p-3 rounded border">
                <input type="text" name="titulo" class="form-control form-control-sm mb-2" placeholder="Título" required>
                <textarea name="desc" class="form-control form-control-sm mb-2" rows="2" placeholder="¿Qué quieres proponer?" required></textarea>
                <button class="btn btn-success btn-sm w-100 fw-bold">PUBLICAR AHORA</button>
            </form>
        </div>
        <div class="list-propuestas" style="max-height: 400px; overflow-y: auto;">
            {% for p in propuestas %}
            <div class="p-3 mb-3 border-start border-4 border-primary bg-light rounded shadow-sm">
                <h6 class="fw-bold mb-1 small">{{ p.titulo }}</h6>
                <p class="small mb-2 opacity-75" style="font-size: 0.8rem;">{{ p.descripcion }}</p>
                <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-2">
                    <span class="small text-navy fw-bold" style="font-size: 0.65rem;">
                        <i class="fas fa-user-edit me-1"></i>{{ p.autor.usuario.nombre }} {{ p.autor.usuario.apellidos }}
                    </span>
                    <span class="text-muted" style="font-size: 0.6rem;">
                        <i class="far fa-calendar-alt me-1"></i>{{ p.fecha.strftime('%d/%m/%Y %H:%M') if p.fecha else '25/01/2026' }}
                    </span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
