<div class="row g-4 mt-2 px-3">
    <div class="col-12">
        <div class="card border-0 shadow-lg" style="border-radius: 25px; background: #fff;">
            <div class="card-body p-4">
                <h4 class="fw-bold text-navy mb-4"><i class="fas fa-chart-bar me-2"></i>Indicadores de Rendimiento por Curso</h4>
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <div style="height: 350px;">
                            <canvas id="canvasCursosBar"></canvas>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-4 bg-light rounded-4 border text-center shadow-sm">
                            <h6 class="fw-bold small text-muted text-uppercase mb-3">Rendimiento Institucional</h6>
                            <div class="display-6 fw-bold text-primary mb-2">{{ promedio }}%</div>
                            <div class="progress" style="height: 12px; border-radius: 10px;">
                                <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" style="width: {{ promedio }}%"></div>
                            </div>
                            <p class="small text-muted mt-3 mb-0">Promedio total acumulado de todos los niveles académicos.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
