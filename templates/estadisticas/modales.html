<div class="modal fade" id="modalResetDel" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <form action="{{ url_for('reiniciar_elecciones') }}" method="POST" class="modal-content border-0" style="border-radius: 20px;">
            <div class="modal-body text-center p-4">
                <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                <h5 class="fw-bold">Reiniciar Delegado</h5>
                <p class="small text-muted">Se borrarán todos los candidatos y sus votos actuales.</p>
                <input type="password" name="codigo" class="form-control form-control-sm text-center mb-3" placeholder="Código Admin" required>
                <button class="btn btn-danger w-100 btn-sm fw-bold">LIMPIAR ELECCIONES</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="modalResetProf" tabindex="-1">

        <form action="{{ url_for('reiniciar_votos_profesor') }}" method="POST" class="modal-content border-0" style="border-radius: 20px;">
            <div class="modal-body text-center p-4">
                <i class="fas fa-user-shield text-danger fa-3x mb-3"></i>
                <h5 class="fw-bold">Reiniciar Docentes</h5>
                <p class="small text-muted">Esta acción borrará todos los corazones acumulados.</p>
