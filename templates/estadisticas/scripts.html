<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Filtro de búsqueda de profesores
        const filterInput = document.getElementById('filterProfesor');
        if (filterInput) {
            filterInput.addEventListener('keyup', function() {
                const term = filterInput.value.toLowerCase();
                const cards = document.querySelectorAll('.prof-card');
                cards.forEach(card => {
                    const nombre = card.getAttribute('data-nombre');
                    card.style.display = nombre.includes(term) ? 'block' : 'none';
                });
            });
        }

        // Gráfico de Cursos
        const barEl = document.getElementById('canvasCursosBar');
        if (barEl) {
            const ctxBar = barEl.getContext('2d');
            new Chart(ctxBar, {
                type: 'bar', 
                data: {
                    labels: ['1er Curso', '2do Curso', '3er Curso', '4to Curso', '5to Curso', '6to Curso'],
                    datasets: [{
                        label: 'Puntuación Total',
                        data: [
                            {{ stats_cursos.get('PRIMER CURSO', 0) }},
                            {{ stats_cursos.get('SEGUNDO CURSO', 0) }},
                            {{ stats_cursos.get('TERCER CURSO', 0) }},
                            {{ stats_cursos.get('CUARTO CURSO', 0) }},
                            {{ stats_cursos.get('QUINTO CURSO', 0) }},
                            {{ stats_cursos.get('SEXTO CURSO', 0) }}
                        ],
                        backgroundColor: '#ffa500', 
                        borderColor: '#cc8400',
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [5, 5] }, title: { display: true, text: 'Puntos Acumulados' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // Gráfico Ranking Estudiantes
        const rankEl = document.getElementById('canvasRanking');
        if (rankEl) {
            const ctx = rankEl.getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [{% for est in ranking[:5] %}"{{ est.nombre }}",{% endfor %}],
                    datasets: [{
                        label: 'Puntos Totales',
                        data: [{% for est in ranking[:5] %}{{ est.puntos_totales }},{% endfor %}],
                        backgroundColor: 'rgba(26, 35, 126, 0.7)',
                        borderColor: '#1a237e',
                        borderWidth: 2,
                        borderRadius: 10,
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { beginAtZero: true, grid: { display: false } },
                        y: { grid: { display: false } }
                    }
                }
            });
        }
    });

    // Restauración de Scroll
    window.addEventListener('beforeunload', () => {
        sessionStorage.setItem('scrollPos', window.scrollY);
    });

    window.addEventListener('load', () => {
        const scrollPos = sessionStorage.getItem('scrollPos');
        if (scrollPos) {
            window.scrollTo({ top: parseInt(scrollPos), behavior: 'instant' });
            sessionStorage.removeItem('scrollPos');
        }
    });
</script>
