<div class="card border-0 shadow-lg mb-4" style="border-radius: 25px;">
    <div class="card-header bg-white border-0 py-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0 fw-bold text-danger"><i class="fas fa-chalkboard-teacher me-2"></i>Docentes</h4>
            {% if profesores and profesores[0].num_votos > 0 %}
            <span class="badge bg-warning-subtle text-dark border border-warning rounded-pill px-3">
                🏆 Líder: {{ profesores[0].nombre }}
            </span>
            {% endif %}
        </div>
        <div class="input-group input-group-sm shadow-sm">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="filterProfesor" class="form-control border-start-0" placeholder="Buscar por nombre o especialidad...">
        </div>
    </div>
    <div class="card-body px-4">
        <div class="profesores-container row g-3" id="listaProfesores" style="max-height: 500px; overflow-y: auto;">
            </div>
    </div>
</div>
