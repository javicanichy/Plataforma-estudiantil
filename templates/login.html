{% extends "base.html" %}

{% block content %}
<style>
    /* Estilos específicos para centrar el login y darle un toque moderno */
    .login-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        overflow: hidden;
        max-width: 420px;
        width: 100%;
        background: #fff;
    }
    .login-header {
        padding: 30px 30px 10px 30px;
        text-align: center;
    }
    .login-body {
        padding: 30px;
    }
    .form-label {
        font-size: 0.85rem;
        letter-spacing: 0.5px;
    }
    .input-group-text {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
    }
    .form-control {
        border: 1px solid #dee2e6;
        padding: 10px 12px;
    }
    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
    }
    .btn-login {
        padding: 12px;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.9rem;
    }
    .divider {
        height: 1px;
        background: #eee;
        margin: 25px 0;
    }
</style>

<div class="login-wrapper">
    <div class="card login-card">
        <div class="login-header">
            <div class="mb-3">
                <i class="bi bi-shield-check text-primary" style="font-size: 2.5rem;"></i>
            </div>
            <h4 class="fw-bold">Acceso usuarios corporativos</h4>
            <p class="text-muted small">Usa tu identidad institucional</p>
        </div>
        
        <div class="login-body">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary text-uppercase">Correo Institucional</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="correo" class="form-control" 
                               placeholder="ej: nombre.apellido@unge.gq" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary text-uppercase">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" id="password" class="form-control" 
                               placeholder="••••••••" required>
                    </div>
                </div>

                <div id="mensajeError" class="alert alert-danger d-none py-2 mb-3 small">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span></span>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-login" id="btnLogin">
                    Entrar al Sistema
                </button>
            </form>

            <div class="divider"></div>
            
            <div class="text-center">
                <p class="small text-muted mb-2">¿Problemas con tu acceso?</p>
                <a href="{{ url_for('registro_estudiante') }}" class="btn btn-outline-secondary btn-sm w-100">
                    <i class="bi bi-unlock me-1"></i> Activar o recuperar cuenta
                </a>
            </div>
        </div>
        <div class="card-footer bg-light border-0 py-3 text-center">
            <small class="text-muted">Facultad de Ciencias de la Salud</small>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnLogin');
    const errorDiv = document.getElementById('mensajeError');
    const correo = document.getElementById('correo').value;
    const password = document.getElementById('password').value;

    // Estado visual de carga
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Autenticando...';
    errorDiv.classList.add('d-none');

    // Llamada a tu API de autenticación
    fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ correo: correo, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.ok) {
            // Éxito: Redirección al panel principal
            window.location.href = "{{ url_for('inicio') }}";
        } else {
            // Error: Restaurar botón y mostrar mensaje
            btn.disabled = false;
            btn.innerHTML = 'Entrar al Sistema';
            errorDiv.querySelector('span').innerText = data.mensaje;
            errorDiv.classList.remove('d-none');
        }
    })
    .catch(err => {
        btn.disabled = false;
        btn.innerHTML = 'Entrar al Sistema';
        errorDiv.querySelector('span').innerText = "Error de conexión con el servidor";
        errorDiv.classList.remove('d-none');
    });
});
</script>
{% endblock %}
