{% extends "base.html" %}
{% block title %}Iniciar sesión - UNGE Facultad de Ciencias de la Salud{% endblock %}

{% block content %}
<!--
  login.html — Formulario de autenticación
  IDs y names coherentes con main.js y backend:
  - correo (type email)
  - clave (type password) — IMPORTANTE: NO password_hash
-->
<section class="container container-narrow my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Iniciar sesión</h2>

          <!-- Formulario id obligatorio: form-login -->
          <form id="form-login" novalidate>
            <!-- Campo correo -->
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input 
                type="email" 
                class="form-control" 
                id="correo" 
                name="correo" 
                placeholder="tu@correo.com"
                autocomplete="email"
                required
              >
              <div class="invalid-feedback">Introduce un correo válido.</div>
            </div>

            <!-- Campo contraseña: id/name DEBE ser 'clave' (NO password_hash) -->
            <div class="mb-3">
              <label for="clave" class="form-label">Contraseña</label>
              <input 
                type="password" 
                class="form-control" 
                id="clave" 
                name="clave" 
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
              >
              <div class="invalid-feedback">Introduce tu contraseña.</div>
            </div>

            <!-- Mensaje de estado (error/éxito) -->
            <div id="login-mensaje" class="mb-3 text-center text-danger" role="status" aria-live="polite"></div>

            <!-- Botón enviar -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Iniciar sesión</button>
            </div>

            <!-- Opciones adicionales -->
            <div class="text-center mt-3">
              <small><a href="/contacto">¿Olvidaste la contraseña?</a></small>
            </div>
          </form>
          <!-- fin formulario -->
        </div>
      </div>

      <!-- Enlace a registro -->
      <p class="text-center mt-3">
        ¿No tienes cuenta? <a href="/registro" class="fw-bold">Regístrate aquí</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
