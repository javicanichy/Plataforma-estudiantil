<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - {% block title %}{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Estilos globales del panel */
        :root { --sidebar-width: 260px; }
        body { background-color: #f4f7f6; }
        
        .sidebar { 
            width: var(--sidebar-width); 
            height: 100vh; 
            position: fixed; 
            background: #2c3e50; 
            color: white; 
        }

        .main-content { 
            margin-left: var(--sidebar-width); 
            padding: 20px; 
        }

        /* Tus estilos de transparencia para cuentas desactivadas */
        .row-pausada { opacity: 0.5; filter: grayscale(100%); background-color: #f8f9fa !important; }
        .row-pausada td:last-child { opacity: 1; filter: none; }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="sidebar p-3">
        <div class="text-center mb-4">
            {% if current_user.foto_perfil %}
                <img src="{{ url_for('static', filename='uploads/perfiles/' ~ current_user.foto_perfil) }}" class="rounded-circle img-thumbnail" style="width: 80px; height: 80px; object-fit: cover;">
            {% else %}
                <div class="bg-primary rounded-circle mx-auto d-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                    {{ current_user.nombre[0] }}
                </div>
            {% endif %}
            <h6 class="mt-2">{{ current_user.nombre }}</h6>
            <small class="badge bg-danger">{{ current_user.rol }}</small>
        </div>
        
        <ul class="nav flex-column">
            <li class="nav-item"><a href="/panel_admin" class="nav-link text-white"><i class="fas fa-home me-2"></i> Inicio</a></li>
            <li class="nav-item mt-5">
                <a href="/logout" class="nav-link text-danger" onclick="confirmarSalida(event)">
                    <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="container-fluid">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
function confirmarSalida(event) {
    // Evita que el enlace se abra inmediatamente
    event.preventDefault(); 
    
    const url = event.currentTarget.getAttribute('href');
    
    // Usamos el confirm nativo del navegador (rápido y efectivo)
    const respuesta = confirm("¿Estás seguro de que deseas cerrar tu sesión académica?");
    
    if (respuesta) {
        // Si el usuario acepta, lo redirigimos al logout
        window.location.href = url;
    }
}
</script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
