{% extends "base.html" %}

{% block content %}

<!-- Botón flotante fuera del container -->
<div class="d-flex justify-content-end px-4 mt-3">
    <a href="{{ url_for('nueva_noticia') }}" class="btn btn-success">
        ➕ Crear noticia
    </a>
</div>

<div class="container mt-4">

    <h2 class="mb-4">Todas las noticias</h2>

    <div class="row g-3">
        {% for noticia in noticias %}
        <div class="col-md-4">
            <div class="card h-100 noticia-card">
                
                {% if noticia.archivo %}
                    <img src="{{ url_for('static', filename='uploads/' ~ noticia.archivo) }}" 
                         class="card-img-top" alt="{{ noticia.titulo }}">
                {% endif %}
                
                <div class="card-body">
                    <h5 class="card-title">{{ noticia.titulo }}</h5>
                    <p class="text-muted">{{ noticia.fecha.strftime('%d/%m/%Y') }}</p>
                    <p class="card-text">{{ noticia.contenido[:100] }}...</p>
                    <a href="{{ url_for('noticia_completa', noticia_id=noticia.id) }}" class="btn btn-primary">
                        Leer noticia
                    </a>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
