<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Acceso | UNGE - FCS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --unge-blue: #1a237e; --unge-orange: #ff6f00; --success-green: #2ecc71; }
        body { background-color: #f0f2f5; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-reset { background: #ffffff; border: none; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; width: 100%; max-width: 450px; }
        .header-accent { background: linear-gradient(90deg, var(--unge-blue), #3949ab); height: 8px; width: 100%; }
        .form-label { color: #455a64; font-size: 0.75rem; letter-spacing: 0.5px; }
        .form-control { border-radius: 12px; padding: 12px 15px; border: 1.5px solid #e1e8ed; font-size: 0.95rem; }
        .form-control:focus { border-color: var(--unge-blue); box-shadow: none; background-color: #f8faff; }
        .input-codigo { letter-spacing: 4px; font-size: 1.2rem; background-color: #fdfdfd !important; border-style: dashed; }
        .btn-update { background-color: var(--unge-blue); border: none; border-radius: 12px; padding: 16px; font-weight: 700; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-update:disabled { background-color: #9ea7ad; cursor: not-allowed; transform: none; }
        .btn-update:not(:disabled):hover { background-color: #0d1250; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26, 35, 126, 0.25); }
        .password-strength-container { height: 6px; background: #eee; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .password-strength-bar { height: 100%; width: 0%; transition: all 0.5s ease; }
        .match-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; display: none; }
        .brand-logo { max-width: 65px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); border-radius: 8px; }
    </style>
</head>
<body>

<div class="container d-flex flex-column align-items-center">
    <div class="text-center mb-4">
        <img src="/static/img/logo_unge.jpeg" alt="UNGE" class="brand-logo mb-2">
        <h5 class="fw-bold text-dark mt-2">Sistema de Gestión Central</h5>
    </div>

    <div class="card card-reset">
        <div class="header-accent"></div>
        <div class="card-body p-4 p-md-5">
            
            <div class="mb-4 text-center">
                <h3 class="fw-bold h4">Actualizar Acceso</h3>
                <p class="text-muted small">Define una nueva contraseña para recuperar el acceso a tu cuenta institucional.</p>
            </div>

            <form action="{{url_for('finalizar_restablecimiento')}}" method="POST" id="resetForm">
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-uppercase">Canal de Recuperación</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-envelope-open-text"></i></span>
                        <input type="email" name="email" id="email" class="form-control border-start-0 bg-light" required readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-uppercase">Token de Seguridad</label>
                    <input type="text" name="codigo" id="codigo" class="form-control text-center fw-bold input-codigo" maxlength="6" required placeholder="######">
                </div>

                <hr class="my-4 opacity-25">

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label fw-bold text-uppercase">Nueva Contraseña</label>
                        <span id="strengthText" class="small fw-bold" style="font-size: 0.65rem;"></span>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-key"></i></span>
                        <input type="password" name="nueva_pass" id="nueva_pass" class="form-control border-start-0 border-end-0" required minlength="6" placeholder="••••••••">
                        <button class="btn bg-white border border-start-0 text-muted" type="button" onclick="togglePass('nueva_pass', 'eye1')">
                            <i class="fas fa-eye" id="eye1"></i>
                        </button>
                    </div>
                    <div class="password-strength-container">
                        <div id="strengthBar" class="password-strength-bar"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label fw-bold text-uppercase">Confirmar Nueva Contraseña</label>
                        <span id="matchBadge" class="match-badge"></span>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-check-double"></i></span>
                        <input type="password" id="confirm_pass" class="form-control border-start-0 border-end-0" required placeholder="••••••••">
                        <button class="btn bg-white border border-start-0 text-muted" type="button" onclick="togglePass('confirm_pass', 'eye2')">
                            <i class="fas fa-eye" id="eye2"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-update btn-primary w-100 shadow-sm" disabled>
                    ACTUALIZAR CUENTA <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const passInput = document.getElementById('nueva_pass');
    const confirmInput = document.getElementById('confirm_pass');
    const submitBtn = document.getElementById('submitBtn');
    const matchBadge = document.getElementById('matchBadge');

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('email')) document.getElementById('email').value = params.get('email');
        if (params.get('codigo')) document.getElementById('codigo').value = params.get('codigo');
    };

    function togglePass(id, iconId) {
        const input = document.getElementById(id);
        const icon = document.getElementById(iconId);
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    }

    function validatePasswords() {
        const pass = passInput.value;
        const confirm = confirmInput.value;
        if (confirm.length > 0) {
            matchBadge.style.display = 'inline-block';
            if (pass === confirm && pass.length >= 6) {
                matchBadge.textContent = 'Coinciden';
                matchBadge.className = 'match-badge bg-success text-white';
                submitBtn.disabled = false;
            } else {
                matchBadge.textContent = 'No coinciden';
                matchBadge.className = 'match-badge bg-danger text-white';
                submitBtn.disabled = true;
            }
        } else {
            matchBadge.style.display = 'none';
            submitBtn.disabled = true;
        }
    }

    passInput.addEventListener('input', function() {
        const val = this.value;
        const bar = document.getElementById('strengthBar');
        const txt = document.getElementById('strengthText');
        let strength = 0;
        if (val.length >= 6) strength += 30;
        if (val.match(/[A-Z]/)) strength += 35;
        if (val.match(/[0-9]/)) strength += 35;
        bar.style.width = strength + '%';
        if (strength < 40) { bar.style.backgroundColor = '#ff4d4d'; txt.textContent = 'DÉBIL'; txt.style.color = '#ff4d4d'; }
        else if (strength < 80) { bar.style.backgroundColor = '#f1c40f'; txt.textContent = 'MEDIA'; txt.style.color = '#f1c40f'; }
        else { bar.style.backgroundColor = '#2ecc71'; txt.textContent = 'FUERTE'; txt.style.color = '#2ecc71'; }
        validatePasswords();
    });

    confirmInput.addEventListener('input', validatePasswords);

    // Lógica de Redirección Automática
    document.getElementById('resetForm').onsubmit = async function(e) {
        e.preventDefault();
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Procesando...';
        submitBtn.disabled = true;

        const formData = new FormData(this);
        try {
            const response = await fetch(this.action, { method: 'POST', body: formData });
            const result = await response.json();

            if (result.status === 'success') {
                Swal.fire({
                    title: '¡Éxito!',
                    text: result.message,
                    icon: 'success',
                    timer: 5000,
                    timerProgressBar: true,
                    confirmButtonText: 'Ir al Login ahora',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = result.redirect;
                });
            } else {
                Swal.fire('Error', result.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'ACTUALIZAR CUENTA <i class="fas fa-arrow-right ms-2"></i>';
            }
        } catch (error) {
            Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
            submitBtn.disabled = false;
        }
    };
</script>




<script>
    // Guardar la posición antes de salir o recargar
    window.addEventListener('beforeunload', () => {
        sessionStorage.setItem('scrollPos', window.scrollY);
    });

    // Restaurar la posición al cargar
    window.addEventListener('load', () => {
        const scrollPos = sessionStorage.getItem('scrollPos');
        if (scrollPos) {
            window.scrollTo({
                top: parseInt(scrollPos),
                behavior: 'instant' // 'smooth' si prefieres que se vea el desplazamiento
            });
            sessionStorage.removeItem('scrollPos'); // Limpiar para no afectar otras cargas
        }
    });
</script>

</body>
</html>
