{% extends "base.html" %}
{% block title %}Calendario - UNGE Facultad de Ciencias de la Salud{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4 text-center">Calendario Académico</h2>

    <!-- Reloj en tiempo real (público) -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-4">
            <div class="card bg-light shadow-sm text-center p-4">
                <h5 class="card-title">Hora actual</h5>
                <div id="reloj" class="display-4 fw-bold text-primary" style="font-family: 'Courier New', monospace;">
                    --:--:--
                </div>
                <small class="text-muted" id="fecha-actual">Cargando...</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
