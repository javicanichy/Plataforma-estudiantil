<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | UNGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/撥all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .admin-card {
            border: none;
            border-top: 5px solid #800000; /* Rojo UNGE */
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .btn-admin {
            background-color: #800000;
            color: white;
            transition: 0.3s;
        }
        .btn-admin:hover {
            background-color: #a00000;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card admin-card p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-user-shield fa-4x text-dark mb-3"></i>
                    <h3 class="fw-bold">ADMINISTRACIÓN</h3>
                    <p class="text-muted small">Terminal de Gestión de Facultad</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} small">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="{{ url_for('login_admin') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Usuario Administrador</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-terminal"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="admin_user" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Contraseña de Seguridad</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-admin w-100 py-2 fw-bold">
                        ACCEDER AL SISTEMA
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <a href="/" class="text-decoration-none text-muted small">
                        <i class="fas fa-arrow-left"></i> Volver al Portal Público
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
